<style>
/* ===== Studio family themes; Hub accent = #8E4AEE ===== */
:root,[data-theme="dark"]{
  --font-ui:"Segoe UI",system-ui,-apple-system,sans-serif;

  --btn-radius:0px;--radius:0px;--card:#0f0f0f;--card-border:#59224e;--shadow:0 0 0 1px #752b66,0 8px 24px rgba(0,0,0,.8);

/* CLI White: a terminal — black, white, monospace, square */
[data-theme="cli-white"]{
  --font-ui:ui-monospace,"SF Mono","Cascadia Mono",Menlo,Consolas,"DejaVu Sans Mono",monospace;--bg:#0a0a0a;
  --chrome:#0f0f0f;--panel:#0d0d0d;--line:#343434;--border:#3e3e3e;--hover:#2a2a2a;--text:#d3d3d3;--dim:#8a8a8a;
  --strong:#f1f1f1;--accent:#c2c2c2;--accent2:#a8a8a8;--on-accent:#151515;--cta:#a8a8a8;--cta-hover:#c2c2c2;
  --btn-radius:0px;--radius:0px;--card:#0f0f0f;--card-border:#3e3e3e;--shadow:0 0 0 1px #525252,0 8px 24px rgba(0,0,0,.8);
  --ok:#3ddc84;--warn:#e5c07b;--danger:#ff5f56;
  color-scheme:dark}
/* Midnight: dark */
[data-theme="midnight"]{
  --font-ui:"Segoe UI",system-ui,-apple-system,sans-serif;--bg:#0b1020;--chrome:#111833;--panel:#0f1630;--line:#1c2749;
  --border:#26345e;--hover:#1b2650;--text:#d3dbf2;--dim:#8290b8;--strong:#ffffff;--accent:#4888f2;--accent2:#3f84f0;
  --on-accent:#ffffff;--cta:#3f84f0;--cta-hover:#5b9cff;--btn-radius:6px;--radius:6px;--card:#131b38;
  --card-border:#26345e;--shadow:0 10px 28px rgba(2,5,15,.65);--ok:#4fd18b;--warn:#f0b85a;--danger:#ff6b7a;
  color-scheme:dark}
/* Dusk: dark */
[data-theme="dusk"]{
  --font-ui:"Segoe UI",system-ui,-apple-system,sans-serif;--bg:#16101f;--chrome:#1e1629;--panel:#1b1426;--line:#2c2140;
  --border:#3a2b52;--hover:#2e2241;--text:#e6dcf2;--dim:#9d8cb6;--strong:#ffffff;--accent:#b066e6;--accent2:#a95ee6;
  --on-accent:#ffffff;--cta:#a95ee6;--cta-hover:#c47cf5;--btn-radius:8px;--radius:8px;--card:#221930;
  --card-border:#3a2b52;--shadow:0 10px 28px rgba(8,3,14,.65);--ok:#5fd39a;--warn:#f5b86b;--danger:#ff6b8b;
  color-scheme:dark}
/* Graphite: dark */
[data-theme="graphite"]{
  --font-ui:"Segoe UI",system-ui,-apple-system,sans-serif;--bg:#18191b;--chrome:#222326;--panel:#1f2023;--line:#2e3034;
  --border:#393b40;--hover:#303237;--text:#dcdde0;--dim:#8e9096;--strong:#ffffff;--accent:#ff8a3d;--accent2:#f07224;
  --on-accent:#1a0d03;--cta:#f07224;--cta-hover:#ff8a3d;--btn-radius:4px;--radius:4px;--card:#25262a;
  --card-border:#393b40;--shadow:0 10px 28px rgba(0,0,0,.6);--ok:#5ccf86;--warn:#f2c14e;--danger:#ff6060;
  color-scheme:dark}
/* High contrast: dark */
[data-theme="contrast"]{
  --font-ui:"Segoe UI",system-ui,-apple-system,sans-serif;--bg:#000000;--chrome:#000000;--panel:#000000;--line:#8a8a8a;
  --border:#bfbfbf;--hover:#262626;--text:#ffffff;--dim:#d0d0d0;--strong:#ffffff;--accent:#ffd400;--accent2:#ffd400;
  --on-accent:#000000;--cta:#ffd400;--cta-hover:#ffe14d;--btn-radius:4px;--radius:4px;--card:#000000;
  --card-border:#ffffff;--shadow:0 0 0 2px #ffffff;--ok:#3cff7a;--warn:#ffd400;--danger:#ff4d4d;
  color-scheme:dark}
/* Sand: light */
[data-theme="sand"]{
  --font-ui:"Segoe UI",system-ui,-apple-system,sans-serif;--bg:#ece4d6;--chrome:#f7f1e6;--panel:#f8f3ea;--line:#d8ccb6;
  --border:#e0d5c1;--hover:#e8decb;--text:#3b3226;--dim:#7a6c58;--strong:#231c13;--accent:#c2562b;--accent2:#a8461f;
  --on-accent:#ffffff;--cta:#b54d24;--cta-hover:#9c401b;--btn-radius:6px;--radius:6px;--card:#fbf7f0;
  --card-border:#e0d5c1;--shadow:0 10px 28px rgba(80,60,30,.2);--ok:#3f8f4a;--warn:#a8700d;--danger:#c0392b;
  color-scheme:light}
/* Rosé: light */
[data-theme="rose"]{
  --font-ui:"Segoe UI",system-ui,-apple-system,sans-serif;--bg:#f3e6ea;--chrome:#fdf6f8;--panel:#fdf7f9;--line:#e6cdd5;
  --border:#ecd7de;--hover:#f1e0e6;--text:#3d2a31;--dim:#87666f;--strong:#2a1a20;--accent:#c8366b;--accent2:#ad2a5a;
  --on-accent:#ffffff;--cta:#c2305f;--cta-hover:#a82752;--btn-radius:8px;--radius:8px;--card:#ffffff;
  --card-border:#ecd7de;--shadow:0 10px 28px rgba(110,40,65,.18);--ok:#2f8a55;--warn:#a86b0d;--danger:#c8283c;
  color-scheme:light}

/* App tile: dark fade in dark themes, light fade in light themes (also used for the window/taskbar icon, see native.js) */
:root{--tile-a:#2e0f57;--tile-b:#9b59f0}
[data-theme="light"],[data-theme="github"],[data-theme="sand"],[data-theme="rose"]{--tile-a:#8e4aee;--tile-b:#d2b4ff}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:13px/1.45 var(--font-ui);display:flex;flex-direction:column;user-select:none;overflow:hidden}
button{font:inherit;color:inherit}
::-webkit-scrollbar{width:12px;height:12px}
::-webkit-scrollbar-thumb{background:#5a5a5a55;border:3px solid transparent;background-clip:content-box;border-radius:8px}

header{display:flex;align-items:center;gap:14px;padding:14px 22px;background:var(--chrome);border-bottom:1px solid var(--line);flex:none}
.logo{width:38px;height:38px;border-radius:22.5%;background:linear-gradient(135deg,var(--tile-a),var(--tile-b));color:#fff;font-weight:800;font-size:15px;display:grid;place-items:center;letter-spacing:-.02em;flex:none}
.brand h1{margin:0;font-size:17px;font-weight:650;color:var(--strong)}
.brand p{margin:0;color:var(--dim);font-size:12px}
.flex{flex:1}
.lib{display:flex;align-items:center;gap:8px;max-width:420px;padding:5px 6px 5px 12px;border:1px solid var(--border);border-radius:999px;background:var(--panel);color:var(--dim)}
.lib span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;direction:rtl}
.ibtn{height:32px;min-width:32px;padding:0 8px;background:none;border:1px solid transparent;border-radius:var(--radius);display:inline-grid;place-items:center;cursor:default}
.ibtn:hover{background:var(--hover)}
.ibtn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ibtn.spin svg{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.btn{height:30px;padding:0 16px;border-radius:var(--btn-radius);border:1px solid var(--border);background:none;font-weight:600;white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--cta);border-color:var(--cta);color:var(--on-accent)}
.btn.primary:hover{background:var(--cta-hover)}
.btn.small{height:26px;padding:0 10px;font-weight:500}
.btn:disabled{opacity:.45;pointer-events:none}

main{flex:1;overflow:auto;padding:22px 26px 32px}
.sect{margin:6px 0 12px;font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--dim);font-weight:650}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:14px;margin-bottom:26px}
.card{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:16px;align-items:center;padding:16px 16px 16px 18px;background:var(--card);border:1px solid var(--card-border);border-radius:12px}
.card.soon{opacity:.8}
/* Order and pins: cards are dragged between and within the groups; an empty group only shows while dragging. */
.group .card[draggable="true"]{cursor:grab}
.card.dragged{opacity:.45;outline:2px dashed var(--accent);outline-offset:-2px}
body:not(.dragging) .group:not(:has(.card)){display:none}
.drop-hint{display:none;grid-column:1/-1;padding:22px;text-align:center;color:var(--dim);border:1px dashed var(--accent2);border-radius:12px}
.group:not(:has(.card)) .drop-hint{display:block}
.pin{background:none;border:0;padding:0 2px;margin-left:4px;vertical-align:-2px;color:var(--dim);opacity:0;cursor:default}
.pin svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.card:hover .pin,.pin:focus-visible{opacity:1}
.pin:hover{color:var(--strong)}
.pin.on{opacity:1;color:var(--accent)}.pin.on svg{fill:currentColor}
.tile{width:64px;height:64px;border-radius:22.5%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:25px;letter-spacing:-.03em;box-shadow:0 6px 16px rgba(0,0,0,.25)}
.tile.icon{background:none;border-radius:0;box-shadow:none;object-fit:contain;transform:scale(1.14);filter:drop-shadow(0 5px 10px rgba(0,0,0,.28))}
.info h2{margin:0 0 2px;font-size:15px;font-weight:650;color:var(--strong)}
.info p{margin:0 0 7px;color:var(--dim);font-size:12px;line-height:1.4}
.status{display:flex;align-items:center;gap:7px;font-size:12px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--dim);flex:none}
.dot.ok{background:var(--ok)}.dot.update{background:var(--warn)}.dot.busy{background:var(--accent);animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.3}}
.actions{display:flex;flex-direction:column;gap:6px;align-items:stretch;min-width:118px}
.actions .row{display:flex;gap:6px}
.actions .row .btn{flex:1}
.empty{padding:28px;text-align:center;color:var(--dim);border:1px dashed var(--border);border-radius:12px;line-height:1.7}
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);background:var(--card);color:var(--strong);padding:9px 16px;border-radius:var(--radius);
  border:1px solid var(--border);border-left:4px solid var(--accent);box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:.2s;max-width:80vw}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.error{border-left-color:var(--danger)}
.self-update{display:flex;align-items:center;gap:10px;margin:0 0 18px;padding:10px 14px;border:1px solid var(--accent2);border-radius:10px;background:color-mix(in srgb,var(--accent2) 12%,transparent);color:var(--strong)}
.self-update span{flex:1}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);display:grid;place-items:center;z-index:50}
.modal{width:min(680px,92vw);max-height:84vh;display:flex;flex-direction:column;background:var(--card);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow)}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--border);font-size:15px;font-weight:650;color:var(--strong)}
.modal-body{padding:6px 20px 18px;overflow:auto;user-select:text}
.per-app{width:100%;border-collapse:collapse;margin-top:6px}
.per-app th{text-align:left;font-weight:600;color:var(--dim,inherit);padding:6px 8px;border-bottom:1px solid var(--border)}
.per-app td{padding:6px 8px;border-bottom:1px solid var(--border);white-space:nowrap}
.per-app td .tile{width:22px;height:22px;vertical-align:middle;margin-right:6px;transform:none;filter:none}
.per-app select{background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:5px;padding:3px 6px;font:inherit}
.ver{padding:14px 0;border-bottom:1px solid var(--border)}
.ver:last-child{border-bottom:0}
.ver-head{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.ver-head b{font-size:14px;color:var(--strong)}
.ver ul{margin:4px 0 0;padding-left:20px}.ver li{margin:3px 0}.ver p{margin:4px 0}.ver h4{margin:8px 0 2px;font-size:12px}
.ver code{font:12px Consolas,monospace;background:var(--hover);padding:0 4px;border-radius:3px}
.tag.stage{margin-left:6px;vertical-align:middle;white-space:nowrap;display:inline-block;border-color:var(--warn,#e68619);color:var(--warn,#e68619)}
.tag{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:1px 7px;border-radius:999px;border:1px solid var(--accent2);color:var(--accent)}
.tag.ok{border-color:var(--ok);color:var(--ok)}
.tag.warn{border-color:var(--warn,#e68619);color:var(--warn,#e68619)}
.agent-line{margin-top:4px;flex-wrap:wrap}.agent-line .meta-s{color:var(--dim)}
.dim{color:var(--dim)}
</style>
<link rel="stylesheet" href="layouts.css">
<link rel="stylesheet" href="room3d.css">
<style>html{--r3-z:40}.card.r3-flash{outline:2px solid var(--accent);outline-offset:2px}</style>
</head>
